name: Keep Render API awake

# Render's free tier spins the API service down after 15 minutes with no requests, and the
# next request then pays a 30-60s cold-start delay — which looks like "the site is broken"
# for whoever hits it first (admin role changes, support messages, etc.). Pinging it well
# under that 15-minute window keeps it from ever going idle long enough to sleep.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        run: curl -sf --max-time 30 https://tezbozor-api.onrender.com/ || true
